name: Playwright Tests (Playwright Docker image)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.45.3-noble
    env:
       HTTP_USERNAME: ${{ secrets.HTTP_USERNAME }}
       HTTP_PASSWORD: ${{ secrets.HTTP_PASSWORD }}

    steps:

      - name: Show current date and time
        run: |
          date
          date -u
          date +"%Y-%m-%d %H:%M:%S %Z"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Check environment
        run: |
          node -v
          npm -v
          npm ls @faker-js/faker typescript

      - name: Run Playwright tests
        run: npx playwright test --project=e2e

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30